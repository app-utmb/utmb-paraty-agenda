# Publica o app no GitHub Pages a cada push na branch principal.
# Nao precisa de token nem de segredo: usa a permissao nativa do repositorio.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Se dois pushes chegarem juntos, publica o mais recente e cancela o anterior.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verificar:
    name: Testes, tipos e lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  construir:
    name: Construir
    needs: verificar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # O base do Vite precisa bater com a URL do GitHub Pages,
      # que e https://<usuario>.github.io/<repositorio>/
      - name: Definir o caminho base a partir do nome do repositorio
        run: echo "VITE_BASE=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    name: Publicar
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
